apiVersion: v1
kind: Service
metadata:
  name: namegen
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing

spec:
  type: LoadBalancer
  loadBalancerClass: eks.amazonaws.com/nlb

  selector:
    app: namegen

  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
