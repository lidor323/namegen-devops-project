apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb

spec:
  serviceName: mongodb
  replicas: 1

  selector:
    matchLabels:
      app: mongodb

  template:
    metadata:
      labels:
        app: mongodb

    spec:
      containers:
        - name: mongodb
          image: mongo:3.6

          ports:
            - containerPort: 27017

          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: username

            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: password

            - name: APP_DB_USER
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: username

            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: password

          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db

            - name: mongodb-init-script
              mountPath: /docker-entrypoint-initdb.d/init-user.sh
              subPath: init-user.sh

      volumes:
        - name: mongodb-init-script
          configMap:
            name: mongodb-init
            defaultMode: 0755

  volumeClaimTemplates:
    - metadata:
        name: mongodb-data

      spec:
        accessModes:
          - ReadWriteOnce

        storageClassName: ebs-sc

        resources:
          requests:
            storage: 5Gi
