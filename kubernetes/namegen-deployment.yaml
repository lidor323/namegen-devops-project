apiVersion: apps/v1
kind: Deployment
metadata:
  name: namegen

spec:
  replicas: 1

  selector:
    matchLabels:
      app: namegen

  template:
    metadata:
      labels:
        app: namegen

    spec:
      containers:
        - name: namegen
          image: 263296414970.dkr.ecr.us-east-1.amazonaws.com/namegen:1.0

          ports:
            - containerPort: 8080

          env:
            - name: MONGODB_URL
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: mongodb-url
